version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sportiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - sportiq_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportiq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sportiq-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sportiq-net

  data-pipeline:
    build: ./data-pipeline
    container_name: sportiq-pipeline
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SPORTS_API_KEY: ${SPORTS_API_KEY}
      ODDS_API_KEY: ${ODDS_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sportiq-net

  frontend:
    build: ./frontend
    container_name: sportiq-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sportiq-net

networks:
  sportiq-net:
    driver: bridge

volumes:
  sportiq_db_data:
